name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1', '26.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit, HTTP, security, CLI, and legacy regression tests
        run: npm test
      - run: npm run build
      - name: Credential-free two-session recall loop
        run: npm run demo:agent
      - name: Dependency vulnerability audit
        run: npm audit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Signed synthetic wallet and offline workspace scenarios
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: .playwright/
          include-hidden-files: true
          retention-days: 7
